<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Lampstand Output</title>
    <style>
      html,
      body,
      #host {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
        cursor: none;
        user-select: none;
      }
      /* The screen: the picture, edge-blend fades and test pattern sit in it, and screen
         adjustments (keystone, flips, colour) transform it as one. */
      #host {
        position: relative;
      }
    </style>
  </head>
  <body>
    <div id="host"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
