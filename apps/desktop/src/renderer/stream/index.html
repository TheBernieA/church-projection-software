<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Lampstand Stream</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      #stream,
      #camera,
      #back,
      #words {
        position: absolute;
        inset: 0;
      }
      /* Lower third: the slide's words, smaller, near the bottom, over a soft dark band. */
      body.lower-third #words .ls-layer-content {
        transform: translateY(16%) scale(0.6);
        transform-origin: 50% 100%;
      }
      #band {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 36%;
        background: linear-gradient(transparent, rgba(0, 0, 0, 0.72) 55%);
        display: none;
        pointer-events: none;
      }
      body.lower-third.has-words #band {
        display: block;
      }
      /* The NDI words feed: see-through behind the words (alpha), for keying over cameras. */
      html:has(body.transparent),
      body.transparent {
        background: transparent;
      }
    </style>
  </head>
  <body>
    <div id="stream">
      <div id="camera"></div>
      <div id="back"></div>
      <div id="band"></div>
      <div id="words"></div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
