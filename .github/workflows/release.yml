# Installers for Mac (Apple silicon and Intel) and Windows, built on GitHub's own machines.
# Run it by hand: Actions › Release builds › Run workflow. The installers are attached to the run.
# Each is built on its own platform: native libraries (NDI, PDF) are fetched for the machine
# doing the build, so a Windows installer can't be made on a Mac.
name: Release builds
on: workflow_dispatch

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest # Apple silicon
            target: mac
            ffmpeg: mac-arm64
          - os: macos-13 # Intel
            target: mac
            ffmpeg: mac-x64
          - os: windows-latest
            target: win
            ffmpeg: win-x64
    runs-on: ${{ matrix.os }}
    env:
      # Signing is used when the secrets are set (docs/packaging.md); without them the Mac
      # build is ad-hoc signed (fine on your own computers) and the Windows one unsigned.
      HAS_MAC_SIGNING: ${{ secrets.CSC_LINK != '' && secrets.APPLE_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

      # The livestream and recording encoder (resources/ffmpeg/README.md), for this platform.
      - name: Fetch ffmpeg
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ff" && cd "$RUNNER_TEMP/ff"
          npm init -y > /dev/null
          npm install ffmpeg-static@5.2.0 --no-audit --no-fund
          dest="$GITHUB_WORKSPACE/resources/ffmpeg/${{ matrix.ffmpeg }}"
          mkdir -p "$dest"
          cp node_modules/ffmpeg-static/ffmpeg* "$dest/"
          mv "$dest/ffmpeg.LICENSE" "$dest/LICENSE.txt" 2>/dev/null || true
          rm -f "$dest/ffmpeg.README"
          ls -l "$dest"

      - name: Build (Mac, signed and notarized)
        if: matrix.target == 'mac' && env.HAS_MAC_SIGNING == 'true'
        run: pnpm dist:mac
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Build (Mac, unsigned)
        if: matrix.target == 'mac' && env.HAS_MAC_SIGNING != 'true'
        run: pnpm dist:mac:local

      - name: Build (Windows)
        if: matrix.target == 'win'
        run: pnpm dist:win
        env:
          # Optional code-signing certificate (unsigned installers show a SmartScreen warning).
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: lampstand-${{ matrix.ffmpeg }}
          path: |
            apps/desktop/release/*/*.dmg
            apps/desktop/release/*/*.zip
            apps/desktop/release/*/*.exe
          if-no-files-found: error
