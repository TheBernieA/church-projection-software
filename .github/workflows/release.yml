# Installers for Mac (Apple silicon and Intel) and Windows, built on GitHub's own machines.
# Start it by pushing a version tag (git tag v0.1.0 && git push origin v0.1.0), or by hand from
# Actions › Release builds › Run workflow (once this file is on the default branch). The
# installers are attached to the run (Artifacts, at the bottom of its page).
# Each is built on its own platform: native libraries (NDI, PDF) are fetched for the machine
# doing the build, so a Windows installer can't be made on a Mac.
name: Release builds
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest # Apple silicon
            target: mac
            name: mac-arm64
          - os: macos-15-intel # Intel
            target: mac
            name: mac-x64
          - os: windows-latest
            target: win
            name: win-x64
    runs-on: ${{ matrix.os }}
    env:
      # Signing is used when the secrets are set (docs/packaging.md); without them the Mac
      # build is ad-hoc signed (fine on your own computers) and the Windows one unsigned.
      HAS_MAC_SIGNING: ${{ secrets.CSC_LINK != '' && secrets.APPLE_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

      # ffmpeg (livestream and recording) comes with `pnpm install` (ffmpeg-static) and the dist
      # scripts copy it into the app: each runner gets its own platform's.
      - name: Build (Mac, signed and notarized)
        if: matrix.target == 'mac' && env.HAS_MAC_SIGNING == 'true'
        run: pnpm dist:mac
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Build (Mac, unsigned)
        if: matrix.target == 'mac' && env.HAS_MAC_SIGNING != 'true'
        run: pnpm dist:mac:local

      - name: Build (Windows)
        if: matrix.target == 'win'
        run: pnpm dist:win
        env:
          # Optional code-signing certificate (unsigned installers show a SmartScreen warning).
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: lampstand-${{ matrix.name }}
          path: |
            apps/desktop/release/*/*.dmg
            apps/desktop/release/*/*.zip
            apps/desktop/release/*/*.exe
          if-no-files-found: error
