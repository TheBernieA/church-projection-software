packages:
  - apps/*
  - packages/*
allowBuilds:
  electron: true
  esbuild: true
  electron-winstaller: false
  koffi: false
  # Downloads the ffmpeg binary for this computer (packaged with the app for streaming).
  ffmpeg-static: true
minimumReleaseAgeExclude:
  - prettier@3.10.1
  - electron@45.3.1
# Also install the Windows (x64) native binaries, so the Windows installer can be built on a Mac.
supportedArchitectures:
  os: [current, win32]
  cpu: [current, x64]
